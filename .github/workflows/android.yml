name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: تجهيز Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: تثبيت الحزم
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: قائمة نصوص الشرح الصوتي
        run: node tools/voice-list.mjs voice-list.json

      - uses: actions/cache@v4
        with:
          path: www/audio/voice
          key: voice-hamed-${{ hashFiles('voice-list.json', 'www/data/pronounce.json') }}
          restore-keys: voice-hamed-

      - name: توليد الصوت العربي الطبيعي
        continue-on-error: true
        run: |
          pip install edge-tts
          python tools/gen_voice.py voice-list.json www/audio/voice ar-SA-HamedNeural --pronounce
          du -sh www/audio/voice

      - name: نسخ ملفات التطبيق إلى مشروع أندرويد
        run: npx cap sync android

      - name: فك تشفير مفتاح التوقيع
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'vWbnqUvrWf2eLosJHyE14TBl' }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/release.jks.enc -out android/app/release.jks -pass env:PASS

      - name: ذاكرة Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: gradle-
      - name: بناء APK موقّع
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'vWbnqUvrWf2eLosJHyE14TBl' }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew assembleRelease --no-daemon --stacktrace && break; echo "محاولة $i فشلت، إعادة بعد 30 ثانية"; sleep 30; [ $i = 4 ] && exit 1; done

      - name: تسمية الملف
        run: cp android/app/build/outputs/apk/release/app-release.apk guitar-academy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: guitar-academy-apk
          path: guitar-academy.apk

      - name: نشر الإصدار للتحميل المباشر
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest guitar-academy.apk \
            --title "أكاديمية الجيتار — آخر إصدار" \
            --notes "ملف APK جاهز للتثبيت على أندرويد. نزّله من الجوال وافتحه، واسمح بالتثبيت من مصادر غير معروفة إن طُلب منك. الإصدار 1.0.${{ github.run_number }}. التحديثات القادمة تُثبَّت فوق هذا الإصدار مباشرة."
