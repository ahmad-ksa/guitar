name: عينات نطق قبل وبعد
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install edge-tts
      - run: node tools/voice-list.mjs voice-list.json
      - run: python tools/pron_sample.py voice-list.json samples
      - name: نشر العينات للاستماع
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete voice-samples --cleanup-tag -y || true
          gh release create voice-samples samples/* --prerelease --title "عينات النطق: قبل وبعد" --notes "N_before = النطق الحالي ، N_after = بعد تصحيح النطق. نص كل جملة في sentences.txt"
